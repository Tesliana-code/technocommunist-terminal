services:
  postgres:
    image: postgres:17-alpine
    container_name: distribution-engine-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "127.0.0.1:${POSTGRES_PORT}:5432"

    volumes:
      - distribution_engine_pg:/var/lib/postgresql/data

    networks:
      - distribution_engine_net

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  distribution_engine_pg:
    name: distribution_engine_pg

networks:
  distribution_engine_net:
    name: distribution_engine_net
