name: Rust quality gates

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: rust-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Rust ${{ matrix.gate }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        gate: [fmt, test, clippy]
    steps:
      - name: Checkout exact ref
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install Rust toolchain without third-party actions
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
      - name: Run ${{ matrix.gate }}
        shell: bash
        run: |
          set -euo pipefail
          case '${{ matrix.gate }}' in
            fmt) cargo fmt --all -- --check ;;
            test) cargo test --workspace --all-targets --locked ;;
            clippy) cargo clippy --workspace --all-targets --all-features --locked -- -D warnings ;;
            *) exit 2 ;;
          esac

  adversarial:
    name: Adversarial ${{ matrix.suite }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        suite:
          - path_059_authority_recovery
          - path_060_history_completeness_witness
          - pathological_cases
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install stable Rust without third-party actions
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Verify ${{ matrix.suite }} without suppressing failures
        run: cargo test --locked --test ${{ matrix.suite }}
